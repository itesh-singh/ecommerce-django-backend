{% load static %}

<header class="section-header">
  <nav class="navbar p-md-0 navbar-expand-sm navbar-light border-bottom">
    <div class="container">
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTop4" aria-controls="navbarTop4" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarTop4">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <span class="nav-link text-muted">English</span>
          </li>
          <li class="nav-item">
            <span class="nav-link text-muted">USD</span>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="mailto:itesh5906@gmail.com" class="nav-link"><i class="fa fa-envelope"></i> Email</a>
          </li>
          <li class="nav-item">
            <a href="tel:+918009138841" class="nav-link"><i class="fa fa-phone"></i> Call us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="header-main border-bottom">
    <div class="container">
      <div class="row align-items-center g-2">

        <div class="col-12 col-md-3 col-lg-2 mb-3 mb-md-0 text-center text-md-left">
          <a href="{% url 'home' %}" class="brand-wrap d-inline-block">
            <img class="logo img-fluid" src="{% static 'images/logo.png' %}" alt="GreatKart Logo">
          </a>
        </div>

        <div class="col-12 col-md-9 col-lg-10">
          <div class="row align-items-center g-2">

            <div class="col-12 col-lg-2 mb-2 mb-lg-0">
              <div class="category-wrap dropdown">
                <button type="button" class="btn btn-primary btn-block dropdown-toggle" data-toggle="dropdown">
                  <i class="fa fa-bars"></i> All category
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="{% url 'store' %}">All Products</a>
                  {% for category in links %}
                    <a class="dropdown-item" href="{{ category.get_url }}">{{ category.category_name }}</a>
                  {% endfor %}
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-2 mb-2 mb-lg-0">
              <a href="{% url 'store' %}" class="btn btn-outline-primary btn-block">Store</a>
            </div>

            <div class="col-12 col-lg-5 mb-3 mb-lg-0">
              <form action="{% url 'search' %}" method="GET">
                <div class="input-group w-100">
                  <input type="text" class="form-control" placeholder="Search" name="keyword">
                  <div class="input-group-append">
                    <button class="btn btn-primary" type="submit">
                      <i class="fa fa-search"></i>
                    </button>
                  </div>
                </div>
              </form>
            </div>

            <div class="col-12 col-lg-3">
              <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-lg-end">

                <div class="widget-header mb-2 mb-lg-0">
                  {% if user.id is None %}
                    <small class="title text-muted d-block">Welcome guest!</small>
                    <div>
                      <a href="{% url 'login' %}">Sign in</a>
                      <span class="dark-transp"> | </span>
                      <a href="{% url 'register' %}">Register</a>
                    </div>
                  {% else %}
                    <small class="title text-muted d-block">Dashboard {{ user.first_name }}!</small>
                    <div>
                      <a href="{% url 'dashboard' %}">Dashboard</a>
                      <span class="dark-transp"> | </span>
                      <a href="{% url 'logout' %}">Logout</a>
                    </div>
                  {% endif %}
                </div>

                <a href="{% url 'cart' %}" class="widget-header mt-2 mt-lg-0 ml-lg-3 position-relative">
                  <div class="icon icon-sm rounded-circle border">
                    <i class="fa fa-shopping-cart"></i>
                  </div>
                  <span class="badge badge-pill badge-danger notify">{{ cart_count }}</span>
                </a>

              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </section>
</header>
